# Landing page: Next.js static export in site/ (the build also bundles the
# live demo straight from extension/).
[build]
  base = "site"
  command = "npm run build"
  publish = "out"

[build.environment]
  NODE_VERSION = "22"
  NEXT_TELEMETRY_DISABLED = "1"

# Response headers live in site/public/_headers so drag-and-drop deploys get them too.
